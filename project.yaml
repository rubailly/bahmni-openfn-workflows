# Portability spec 4.0 - https://docs.openfn.org/documentation/deploy/portability
#
# THIS FILE IS A SKELETON. It has never been deployed or run against a live
# Bahmni instance. Expressions carry TODO markers where real behaviour is
# still unknown. See README.md and bridge/README.md.

id: bahmni-openfn
name: Bahmni OpenFn Integration (experimental)
description: >-
  Experimental workflows exploring OpenFn as a transformation and routing layer
  for Bahmni. Phase 1 replaces the odoo-connect Atomfeed consumer for a single
  flow on a test instance; it proposes no change to Bahmni upstream.
schema_version: '4.0'

workflows:
  - id: openmrs-patient-to-odoo
    name: OpenMRS patient feed to Odoo
    start: poll-patient-feed
    steps:
      # ---------------------------------------------------------------------
      # Replaces the "customer" flow of openerp-atomfeed-service, which reads
      # /openmrs/ws/atomfeed/patient/recent and creates the matching customer
      # in Odoo.
      #
      # No sidecar service is involved. A cron trigger carries the previous
      # run's final state forward, so state.cursor is the feed position.
      # See: https://docs.openfn.org/documentation/build/triggers
      #
      # The target state is odoo-connect scaled to zero and this workflow as
      # the only writer to Odoo. See docs/cutover-test.md.
      # ---------------------------------------------------------------------
      - id: poll-patient-feed
        name: Every 5 minutes
        type: cron
        cron_expression: '*/5 * * * *'
        enabled: true
        next:
          fetch-feed: true

      - id: fetch-feed
        name: Fetch patient Atom feed
        adaptor: '@openfn/language-http@latest'
        # configuration: "owner|openmrs-atomfeed"   # basic auth, see .env OPENMRS_ATOMFEED_USER
        expression: |
          // The feed is XML, not JSON.
          // TODO: confirm how to parse the Atom response before relying on
          // this. This is the first unknown to resolve - see bridge/README.md.
          get('/openmrs/ws/atomfeed/patient/recent');
        next:
          select-new-entries: true

      - id: select-new-entries
        name: Select entries newer than the cursor
        adaptor: '@openfn/language-common@latest'
        expression: |
          // state.cursor is carried over from the previous successful run.
          // On the very first run it is undefined, in which case process
          // nothing and simply record the newest entry id, so the experiment
          // starts from a known point rather than replaying all history.
          fn(state => {
            const entries = state.entries || [];   // TODO: populate from parsed XML
            const cursor = state.cursor;

            if (!cursor) {
              console.log('No cursor yet - priming from newest entry, processing nothing.');
              return { ...state, toProcess: [], cursor: entries[0]?.id ?? null };
            }

            const idx = entries.findIndex(e => e.id === cursor);
            const toProcess = idx === -1 ? entries : entries.slice(0, idx);

            console.log(`${toProcess.length} new entries since ${cursor}`);
            return { ...state, toProcess };
          });
        next:
          write-to-odoo:
            condition: state.toProcess.length > 0
            label: only when there is new work

      - id: write-to-odoo
        name: Create or update the Odoo customer
        adaptor: '@openfn/language-common@latest'
        expression: |
          // TODO: swap @openfn/language-common for the Odoo adaptor and
          // actually write. Kept as a dry run while odoo-connect may still be
          // running; two writers cannot both be the source of truth.
          //
          // TODO: map to the fields openerp-atomfeed-service actually writes.
          // Compare against the Phase 0 baseline before enabling writes.
          fn(state => {
            for (const entry of state.toProcess) {
              console.log('ODOO PAYLOAD (dry run):', JSON.stringify({
                ref: entry.patientId,
                name: entry.name,
              }));
            }
            return state;
          });
        next:
          advance-cursor: true

      - id: advance-cursor
        name: Advance the cursor
        adaptor: '@openfn/language-common@latest'
        expression: |
          // This step's output becomes the next run's input state, so the
          // cursor must survive here. It advances only if everything upstream
          // succeeded, which gives at-least-once processing: a failed run
          // leaves the cursor untouched and the next run retries.
          fn(state => ({
            ...state,
            cursor: state.toProcess[0]?.id ?? state.cursor,
            toProcess: [],
            entries: [],
          }));
